description:
  limitations: Norge digitalt begrenset. Lisens
  purpose: "Verktøy for planlegging \nKartet skal kunne brukes som et verktøy for\
    \ planlegging og bidra til å redusere nedbygging av natur - og jordbruksarealer,\
    \ ved å synliggjøre allerede opparbeidede arealer.\n\nKartet er nå tilgjengelig\
    \ og skal testes om det gir ønsket kunnskapsgrunnlag."
