# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:arealressurskart-ar50-uml-modell:1.0.0
version: 1.0.0
status: active
name: Arealressurskart - AR50 - UML-modell
schema:
- name: ArealressursFlate
  physicalName: arealressursflate
  logicalType: object
  physicalType: table
  description: 'et sammenhengende areal som er tilordnet de samme egenskapsverdiene
    i henhold til et Arealressursklassifikasjonssystem



    -- Definition --

    a continuous area which has been assigned the same attribute values in accordance
    with an area resource classification system'
  customProperties:
  - property: sosiObjektType
    value: ArealressursFlate
  - property: inheritsFrom
    value: Fellesegenskaper
  - property: associations
    value:
    - role: avgrensning
      target: ArealressursGrense
      cardinality: 1..*
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
        Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
        har samme identifikator.


        NOTE: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til objektet, starter
        med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom data
        produsenten ikke er assosiert med bare et land.


        NOTE 1 : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og vil registreres i "INSPIRE external  Object
        Identifier Namespaces Register"


        Eksempel: NO_SL_AR50_2014'
      required: true
    description: unik identifikasjon av et objekt
    required: true
  - name: informasjon
    logicalType: string
    description: 'generell opplysning


      Merknad:

      Her legges det inn utfyllende informasjon om objektet'
    required: true
  - name: kopidata
    logicalType: object
    properties:
    - name: områdeId
      logicalType: integer
      description: 'identifikasjon av område som dataene dekker


        Merknad: Kan angis med kommunenummer eller fylkesnummer. Disse bør spesifiseres
        nærmere.'
      required: true
    - name: originalDatavert
      logicalType: string
      description: ansvarlig etat for forvaltning av data
      required: true
    - name: kopidato
      logicalType: timestamp
      description: 'dato når objektet ble kopiert fra originaldatasettet


        Merknad:

        Er en del av egenskapen Kopidata. Brukes i de tilfeller hvor en kopidatabase
        brukes til distribusjon.

        Å kopiere et datasett til en kopidatabase skal ikke føre til at Oppdateringsdato
        blir endret.

        Eventuell redigering av data i et kopidatasett medfører ny Oppdateringsdato,
        Datafangstdato og/eller Verifiseringsdato.'
      required: true
    description: 'angivelse av at objektet er hentet fra en kopi av originaldata

      Merknad:

      Kan benyttes dersom man gjør et uttak av en database som ikke inneholder originaldataene.'
    required: true
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/generelle-konsepter/4.5/m%C3%A5lemetodekode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Målemetode
      - property: asDictionary
        value: 'true'
      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    description: 'beskrivelse av kvaliteten på stedfestingen


      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
    required: true
  - name: oppdateringsdato
    logicalType: timestamp
    description: 'dato for siste endring på objektetdataene


      Merknad:

      Oppdateringsdato kan være forskjellig fra Datafangsdato ved at data som er registrert
      kan bufres en kortere eller lengre periode før disse legges inn i datasystemet
      (databasen).


      -Definition-

      Date and time at which this version of the spatial object was inserted or changed
      in the spatial data set.'
    required: true
  - name: område
    logicalType: string
    description: 'objektets utstrekning


      -- Definition --

      area over which an object extends'
    required: true
  - name: arealtype
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/arealressurs/arealressursarealtype
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: ArealressursArealtype
    - property: asDictionary
      value: 'true'
    description: 'hovedinndeling etter kriterier for vegetasjon, naturlig drenering
      og kulturpåvirkning


      -- Definition --

      main categorization according to criteria for vegetation, natural drainage and
      cultural impact'
    required: true
  - name: skogbonitet
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/arealressurs/arealressursskogbonitet
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: ArealressursSkogbonitet
    - property: asDictionary
      value: 'true'
    description: 'inndeling etter arealets evne til å produsere trevirke


      -- Definition --

      categorization according to the ability of the area to produce wood'
    required: true
  - name: treslag
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/arealressurs/arealressurstreslag
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: ArealressursTreslag
    - property: asDictionary
      value: 'true'
    description: 'inndeling etter fordeling av kronedekket mellom bartrær og lauvtrær


      -- Definition --

      categorization according to the distribution of crown cover between coniferous
      and deciduous trees'
    required: true
  - name: jordbruk
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/arealressurs/arealressursjordbruk
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: ArealressursJordbruk
    - property: asDictionary
      value: 'true'
    description: Temaet ’Jordbruk’ dekker samme geografiske område som klasse 20 (Jordbruk)
      i temaet ’Arealtype’. Temaet er basert på AR5. Egenskapsverdiene er numeriske.
    required: true
  - name: vegetasjonsdekke
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/arealressurs/arealressursvegetasjonsdekke
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: ArealressursVegetasjonsdekke
    - property: asDictionary
      value: 'true'
    description: 'informasjon om vegetasjonsdekkets frodighet på snaumark


      -- Definition --

      information concerning the lushness of the vegetation cover on bare land'
    required: true
  - name: kartstandard
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/arealressurs/arealressurskartstandard
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: ArealressursKartstandard
    - property: asDictionary
      value: 'true'
    description: 'informasjon om hvilket klassifikasjonssystem som er brukt


      -- Definition --

      information concerning which classification system has been used'
    required: true
